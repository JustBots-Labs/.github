name: Bug report
description: Something does not work as documented
labels: [bug]
body:
  - type: markdown
    attributes:
      value: For security problems, do not use this form. See the security policy and report privately.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you expected and what you saw instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Plugin, module or package version.
    validations:
      required: true
  - type: input
    id: env
    attributes:
      label: Environment
      description: WordPress, Drupal or Node version, PHP version, hosting.
  - type: input
    id: request
    attributes:
      label: Request ID
      description: The X-Request-Id of the Kelpgate response, if the problem involves a scan.
